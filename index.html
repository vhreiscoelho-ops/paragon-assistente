<script>
/* Direção B (Vidro e ouro). Antes de pintar: cai para superfície sólida e fundo parado quando o aparelho não tem
   backdrop-filter, pede menos movimento/transparência ou é de entrada (pouca memória/núcleos). Nada pode travar. */
(function () {
  var d = document.documentElement, m = function (q) { return window.matchMedia && matchMedia(q).matches; };
  var semVidro = !(window.CSS && CSS.supports && (CSS.supports('backdrop-filter', 'blur(2px)') || CSS.supports('-webkit-backdrop-filter', 'blur(2px)')));
  var fraco = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4 && /android/i.test(navigator.userAgent));
  if (semVidro || fraco || m('(prefers-reduced-transparency: reduce)')) d.classList.add('solido');
  if (fraco || m('(prefers-reduced-motion: reduce)')) d.classList.add('parado');
})();
</script>
